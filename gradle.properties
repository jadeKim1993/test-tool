# 내부망(폐쇄망) 빌드용 Maven 미러. 값이 있으면 Maven Central / Plugin Portal 대신 여기만 본다.
# 인터넷망에서 빌드할 때는 주석 상태로 둔다(= 공개 저장소 사용).
#   커맨드라인:  ./gradlew build -PtesterRepoUrl=https://test.com/repository/maven-public/
#   환경변수:    TESTER_REPO_URL / TESTER_REPO_USER / TESTER_REPO_PASSWORD
# testerRepoUrl=
# testerRepoUser=
# testerRepoPassword=

# dev 태스크가 백엔드/프론트엔드를 동시에 띄우려면 병렬 실행이 필요하다.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
