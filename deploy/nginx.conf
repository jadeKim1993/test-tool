# 테스트 도구 nginx 설정
#
# 배포:
#   1) frontend.zip 을 /usr/share/nginx/html 에 풀어놓는다
#   2) 이 파일을 /etc/nginx/conf.d/tester.conf 로 복사한다
#   3) systemctl reload nginx

upstream tester_api {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 내부망 전용 도구다. 비밀번호가 없으므로 접근 대역을 반드시 제한할 것.
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시가 붙은 자산은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 히스토리 모드: 없는 경로는 index.html 로 넘겨 라우터가 처리하게 한다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # SSE 전용. 버퍼링을 끄지 않으면 실시간 상태가 화면에 뜨지 않는다.
    location /api/stream/ {
        proxy_pass http://tester_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://tester_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
