# 테스트 도구 nginx 설정 — Docker 이미지 전용.
#
# 바로 이 위치의 대상은 백엔드가 **동일 컨테이너가 아니라 별도 서비스**라는 점이다.
# docker-compose 는 서비스명을 DNS 로 풀어 주므로 "backend" 라는 호스트명을 그대로 쓴다.
# (docker 없이 한 장비에 nginx + jar 를 직접 설치하는 경우는 deploy/nginx.conf 를 쓴다 —
# 거기서는 upstream 이 127.0.0.1:8080 이다.)

upstream tester_api {
    # BACKEND_HOST 는 빌드 시점이 아니라 nginx 설정 문법상 고정값이어야 해서
    # docker-compose.yml 의 서비스명(backend)에 맞춰 두었다. 서비스명을 바꾸면 여기도 바꾼다.
    server backend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시가 붙은 자산은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 히스토리 모드: 없는 경로는 index.html 로 넘겨 라우터가 처리하게 한다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # SSE 전용. 버퍼링을 끄지 않으면 실시간 상태가 화면에 뜨지 않는다.
    location /api/stream/ {
        proxy_pass http://tester_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location /api/ {
        proxy_pass http://tester_api;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
