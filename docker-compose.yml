# 테스트 도구 — 백엔드 + 프론트엔드 컴포즈 구성.
#
# 사용법:
#   cp .env.example .env   # TESTER_JWT_SECRET 채우기
#   ./gradlew build        # 이미지에 담을 jar / dist 를 호스트에서 먼저 만든다
#   docker compose up -d --build
#   → http://localhost:${FRONTEND_PORT:-80} 접속
#
# 종료: docker compose down       (데이터 유지, tester-data 볼륨은 남는다)
#       docker compose down -v    (데이터까지 삭제)

services:
  backend:
    build:
      # 이미지는 호스트에서 빌드한 tester-api/build/libs/tester-api.jar 만 담는다.
      # (예전에는 이미지 안에서 Gradle 빌드를 돌렸고 그래서 컨텍스트가 저장소 루트였다)
      context: tester-api
    image: tester-api:local
    restart: unless-stopped
    environment:
      # 비워 두면 기동 시 로그(WARN)와 함께 임시 키를 생성한다. 재시작 시 로그인 세션이
      # 모두 무효화되므로 운영에서는 .env 에 반드시 채울 것.
      TESTER_JWT_SECRET: ${TESTER_JWT_SECRET:-}
      # 컨테이너 기본 시간대는 UTC 라, 비워 두면 만든 로그의 시각(${ts})이 한국 시각보다 9시간 늦게 찍힌다.
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      # H2 파일 DB. 컨테이너를 지우고 다시 만들어도 카테고리/템플릿/대상/작업 설정이 남는다.
      - tester-data:/app/data
    ports:
      # 직접 API 호출/디버깅용. 실제 서비스 트래픽은 frontend 의 nginx 가 내부망(backend:8080)
      # 으로 프록시하므로 이 포트를 막아도 앱은 정상 동작한다.
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # 이미지에 curl 을 넣지 않는다(폐쇄망 대비). 앱 자신의 --healthcheck 모드를 쓴다.
      test: ["CMD", "java", "-jar", "app.jar", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: tester-frontend
    image: tester-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  tester-data:
